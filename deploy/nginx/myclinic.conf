# MyClinic — nginx virtual hosts. THE source of truth for the VM's nginx:
# edit here, then install (below) — never hand-edit /etc/nginx only.
#
# Sits on the NourNet VM (10.97.100.10); the public IP 193.105.25.131 NATs
# TCP 80/443 straight to it. nginx routes by hostname to the containers:
#
#   myclinic.com.sa            -> web            127.0.0.1:3000
#   portal.myclinic.com.sa     -> portal         127.0.0.1:3001
#   www / ads / testweb.*      -> 301 https://myclinic.com.sa (one canonical host)
#   myclinicsa.com.sa (old)    -> 301 https://myclinic.com.sa (domain retired)
#   staging.*                  -> staging web    127.0.0.1:3100 (internal only)
#   portalstaging.*            -> staging portal 127.0.0.1:3101 (internal only)
#
# TLS: the NourNet-issued wildcard (*.myclinic.com.sa + apex, valid to
# 2027-03) terminates HERE. The __SSL_CERT__ / __SSL_KEY__ placeholders are
# substituted with the real paths at install time — see the install commands —
# so the repo never hardcodes server-local paths. If the edge/WAF ever
# terminates TLS instead, delete the BEGIN TLS..END TLS section; the :80
# blocks stay correct either way ($client_scheme trusts the edge's
# X-Forwarded-Proto, so no redirect loop).
#
# Install (on the VM — from /opt/myclinic after a pull):
#   CERT=$(sudo grep -rhoP 'ssl_certificate\s+\K[^;]+' /etc/nginx/sites-enabled/ | head -1)
#   KEY=$(sudo grep -rhoP 'ssl_certificate_key\s+\K[^;]+' /etc/nginx/sites-enabled/ | head -1)
#   sudo cp deploy/nginx/myclinic.conf /etc/nginx/sites-available/myclinic
#   sudo sed -i "s|__SSL_CERT__|$CERT|; s|__SSL_KEY__|$KEY|" /etc/nginx/sites-available/myclinic
#   sudo ln -sf /etc/nginx/sites-available/myclinic /etc/nginx/sites-enabled/myclinic
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# Trust the edge's X-Forwarded-Proto when present (edge-terminated TLS),
# otherwise report our own scheme.
map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Compression backstop. Next.js gzips its own responses (compress: true) and
# nginx never re-compresses anything already Content-Encoded — this catches
# whatever slips through uncompressed.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml application/rss+xml image/svg+xml font/woff2;

# Keepalive pools to the containers — reusing upstream connections instead of
# a fresh TCP handshake per request. Requires proxy_http_version 1.1 and a
# cleared Connection header at every proxy_pass below.
upstream myclinic_web {
    server 127.0.0.1:3000;
    keepalive 32;
}
upstream myclinic_portal {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ═══ Port 80 ════════════════════════════════════════════════════════════════

# Host consolidation: every alias answers with the one canonical origin.
# www — so the site never lives on two hostnames; ads — the retired Vercel
# deployment's subdomain, kept alive for old links; testweb — the pre-cutover
# validation host; myclinicsa.com.sa — the previous domain (no longer even
# resolves, but a stray hosts-file or bookmark still lands somewhere sane).
server {
    listen 80;
    server_name www.myclinic.com.sa ads.myclinic.com.sa testweb.myclinic.com.sa
                myclinicsa.com.sa www.myclinicsa.com.sa;
    return 301 https://myclinic.com.sa$request_uri;
}

server {
    listen 80 default_server;
    server_name myclinic.com.sa;

    client_max_body_size 25m;

    # Plain-http visitor → https. Skipped when the edge already terminated TLS
    # for us (X-Forwarded-Proto: https), which would otherwise loop forever.
    if ($client_scheme != "https") {
        return 301 https://myclinic.com.sa$request_uri;
    }

    location / {
        proxy_pass http://myclinic_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name portal.myclinic.com.sa;

    client_max_body_size 25m;

    if ($client_scheme != "https") {
        return 301 https://portal.myclinic.com.sa$request_uri;
    }

    location / {
        proxy_pass http://myclinic_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_read_timeout 60s;
    }
}

# ═══ Port 443 ═══ BEGIN TLS (delete this whole section if the edge terminates
# TLS instead of this VM) ════════════════════════════════════════════════════

# Session resumption — spares returning visitors the full TLS handshake.
ssl_session_cache shared:myclinic_ssl:10m;
ssl_session_timeout 1d;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

server {
    listen 443 ssl http2;
    server_name www.myclinic.com.sa ads.myclinic.com.sa testweb.myclinic.com.sa;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    return 301 https://myclinic.com.sa$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name myclinic.com.sa;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        proxy_pass http://myclinic_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    server_name portal.myclinic.com.sa;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        proxy_pass http://myclinic_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# ═══ END TLS ════════════════════════════════════════════════════════════════

# ═══ Staging (internal review only — keep OFF the public edge) ══════════════
server {
    listen 80;
    server_name staging.myclinicsa.com.sa;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }
}

server {
    listen 80;
    server_name portalstaging.myclinic.com.sa;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }
}

# Auto-deploy to the private VM (10.97.100.10) via a SELF-HOSTED runner.
#
# Why self-hosted: the VM only has a private IP — GitHub's cloud runners
# (ubuntu-latest) can never reach it over SSH. Instead a runner installed ON
# the VM polls GitHub over outbound HTTPS and executes this job locally, so
# no inbound access, SSH keys, or secrets are needed.
#
# One-time setup (runner install, clone, .env): docs/VM-Deployment-Guide.md
#
# Optional repository variable (Settings → Secrets and variables → Actions →
# Variables):
#   DEPLOY_PATH   checkout path on the VM, defaults to /opt/myclinic

name: Deploy to VM (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, myclinic-vm]
    timeout-minutes: 30
    steps:
      - name: Pull & rebuild on this server
        run: |
          set -euo pipefail
          APP_DIR="${{ vars.DEPLOY_PATH }}"
          APP_DIR="${APP_DIR:-/opt/myclinic}"
          cd "$APP_DIR"

          echo "── pulling latest main ──"
          git fetch origin main
          git reset --hard origin/main

          echo "── ensuring database is up (web build reads it) ──"
          docker compose up -d --wait db

          echo "── one-time data syncs (marker-guarded, run before web build) ──"
          for SYNC_SQL in scripts/vm-doctor-sync-*.sql; do
            [ -e "$SYNC_SQL" ] || continue
            MARKER=".applied-$(basename "$SYNC_SQL")"
            if [ ! -f "$MARKER" ]; then
              echo "applying $SYNC_SQL"
              docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < "$SYNC_SQL"
              touch "$MARKER"
            fi
          done

          echo "── rebuilding containers ──"
          docker compose up -d --build

          echo "── waiting for services ──"
          sleep 10
          docker compose ps

          # Always shown: if the backend is crash-looping, its boot error is
          # otherwise invisible (this repo has no SSH path to the VM).
          echo "── backend log tail ──"
          docker compose logs --tail=100 backend || true

          echo "── health checks ──"
          # /api/health lives in FastAPI only, and since the explicit-rewrite
          # change (2026-07-14) web/portal no longer proxy it — probe each
          # container for what it actually serves.
          curl -fsS -o /dev/null -w 'site: %{http_code}\n' http://127.0.0.1:3000/
          curl -fsS -o /dev/null -w 'portal login: %{http_code}\n' http://127.0.0.1:3001/login
          # Backend is informational, not fatal: web/portal serve auth/doctors
          # themselves; a dead FastAPI degrades utm/content/whatsapp/uploads.
          docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8020/api/health').read().decode())" \
            || echo "WARN: FastAPI backend is unhealthy — utm/content/whatsapp/uploads APIs are down (see backend log tail above)"

          echo "── pruning old images ──"
          docker image prune -f
